<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin Pixel Office</title>
<style>
  :root { --bg: #14121f; --panel: #1d1a2e; --line: #2e2a47; --text: #ece9ff; --dim: #9a94bf; --teal: #2ee6c5; --red: #ff5d73; --yellow: #ffd166; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif; }
  body { display: flex; }
  #stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; }
  #stage canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #side { width: 320px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header button { font: inherit; font-size: 12px; color: var(--text); background: #2b2745; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  #list { flex: 1; overflow: auto; padding: 8px; }
  .item { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .item:hover, .item.sel { background: #252139; border-color: var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age { color: var(--dim); font-size: 12px; }
  .meta { grid-column: 2 / 4; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-right: 6px; background: #2b2745; color: var(--text); }
  .chip.waiting, .chip.asking { background: var(--red); color: #1a0d12; animation: pulse 1s infinite; }
  .chip.done { background: var(--teal); color: #08201c; }
  .chip.sleeping { background: #33304d; color: var(--dim); }
  @keyframes pulse { 50% { opacity: .55; } }
  .empty { color: var(--dim); padding: 24px 12px; text-align: center; }
  footer { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  @media (max-width: 760px) { body { flex-direction: column; } #side { width: auto; height: 42vh; border-left: 0; border-top: 1px solid var(--line); } #stage { height: 58vh; flex: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="px"></canvas><canvas id="txt"></canvas></div>
<aside id="side">
  <header>
    <h1>DEVIN PIXEL OFFICE</h1>
    <div class="sub"><span id="summary">connecting…</span><button id="notify" hidden></button></div>
  </header>
  <div id="list"></div>
  <footer id="foot">Local only · reads Devin's session store</footer>
</aside>
<script src="app.js"></script>
</body>
</html>
